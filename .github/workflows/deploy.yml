name: Build and Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: build-deploy-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE || secrets.DOCKER_IMAGE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.compute-tag.outputs.IMAGE_TAG }}
      image_ref_latest: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag (date-shortsha)
        id: compute-tag
        run: |
          TAG="$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.compute-tag.outputs.IMAGE_TAG }}

      - name: Build & push (buildx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 필요하면 멀티플랫폼
          # platforms: linux/amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      IMAGE_NAME: ${{ vars.DOCKER_IMAGE || secrets.DOCKER_IMAGE }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add EC2 to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          echo "Deploying $IMAGE_NAME:${IMAGE_TAG} to ${EC2_HOST}"
          ssh ubuntu@"$EC2_HOST" "IMAGE_NAME='${IMAGE_NAME}' IMAGE_TAG='${IMAGE_TAG}' bash -s" < ./deploy.sh
