name: Build and Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Environment Variables
        run: |
          echo "DOCKER_IMAGE_NAME=${{ secrets.DOCKER_IMAGE }}" >> $GITHUB_ENV
          echo "EC2_HOST=${{ secrets.EC2_HOST }}" >> $GITHUB_ENV

      - name: Set Docker image tag
        run: |
          IMAGE_TAG=$(date +'%Y%m%d')-${{ github.sha }}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Log Docker image tag
        run: |
          echo "Docker tag to be used: ${IMAGE_TAG}"

      - name: Build and Push Docker Image (latest)
        run: |
          if [ -z "${DOCKER_IMAGE_NAME}" ]; then
            echo "Error: DOCKER_IMAGE_NAME is not set"; exit 1;
          fi
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${DOCKER_IMAGE_NAME}:latest .
          docker push ${DOCKER_IMAGE_NAME}:latest

      - name: Build and Push Docker Image (tagged)
        run: |
          IMAGE_TAG=${IMAGE_TAG}
          docker build -t ${DOCKER_IMAGE_NAME}:${IMAGE_TAG} .
          docker push ${DOCKER_IMAGE_NAME}:${IMAGE_TAG}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to EC2
        run: |
          echo "Deploying to EC2 Host: $EC2_HOST"
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} \
            "IMAGE_TAG=${IMAGE_TAG} bash -s" < ./deploy.sh